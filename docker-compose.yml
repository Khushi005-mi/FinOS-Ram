services:
  db:
    image: postgres:16-alpine
    container_name: finos_enterprise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finos_user
      POSTGRES_PASSWORD: finos_secure_production_password_2026!
      POSTGRES_DB: finos_db
    ports:
      - "5433:5432"  # Exposed on 5433 to avoid collision with local Mac Postgres
    volumes:
      - finos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finos_user -d finos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Ram-V1/backend
      dockerfile: Dockerfile
    container_name: finos_enterprise_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://finos_user:finos_secure_production_password_2026!@db:5432/finos_db"
      SECRET_KEY: "finos_prod_secret_key_849204820482048204820482048204820482"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      ENVIRONMENT: "production"
      DEBUG: "False"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Ram-V1/frontend
      dockerfile: Dockerfile
    container_name: finos_enterprise_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"

volumes:
  finos_pg_data:
    driver: local
